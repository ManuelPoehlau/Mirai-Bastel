[pytest]
# Bares `pytest` im Repo-Root sammelt `tests/` und die drei Lab-Bäume. `playground/tests` (optionales
# Forschungswerkzeug) und `experiments/knife_oracle/tests` (Knife-Orakel, läuft nach der Trigger-Liste in
# AGENTS.md §8a) sind bewusst nicht dabei: explizit starten, z. B. `xvfb-run -a pytest experiments/knife_oracle/tests`.
# Ohne testpaths kollidiert u.a. experiments/mirai_bastel_core_V1/tests/test_core.py
# mit tests/test_core.py (gleicher Basename, kein __init__.py).
testpaths =
    tests
    experiments/morph_lab/tests
# _archive: obsolete Tests (nicht lauffähig, nur Projektgedächtnis).
norecursedirs = _archive .git __pycache__ node_modules

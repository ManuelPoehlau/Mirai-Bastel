[pytest]
# Bares `pytest` im Repo-Root sammelt `tests/` und die drei Lab-Bäume. `playground/tests` ist bewusst
# nicht dabei (Playground = optionales Forschungswerkzeug, AGENTS.md §8a): explizit starten mit
# `xvfb-run -a pytest playground/tests`.
# Ohne testpaths kollidiert u.a. experiments/mirai_bastel_core_V1/tests/test_core.py
# mit tests/test_core.py (gleicher Basename, kein __init__.py).
testpaths =
    tests
    experiments/symmetry_lab/tests
    experiments/subdivision_lab/tests
    experiments/morph_lab/tests
# _archive: obsolete Tests (nicht lauffähig, nur Projektgedächtnis).
norecursedirs = _archive .git __pycache__ node_modules

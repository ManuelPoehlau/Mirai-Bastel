[pytest]
# Bares `pytest` im Repo-Root sammelt die Production-Suite `tests/` und das Morph Lab (die App startet es über
# `src/morph_bridge.py`). Optionale Bäume laufen nur ausdrücklich, nach AGENTS.md §8a:
# `experiments/knife_oracle/tests` (Knife-Orakel, Trigger-Liste), `experiments/mehlsack_lab`, `experiments/drag_cost`,
# z. B. `xvfb-run -a pytest experiments/knife_oracle/tests -q`.
testpaths =
    tests
    experiments/morph_lab/tests
# _archive: obsolete Tests (nicht lauffähig, nur Projektgedächtnis).
norecursedirs = _archive .git __pycache__ node_modules

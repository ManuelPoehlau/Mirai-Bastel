[pytest]
# Bares `pytest` im Repo-Root sammelt nur die drei dokumentierten Test-Bäume.
# Ohne testpaths kollidiert u.a. experiments/mirai_bastel_core_V1/tests/test_core.py
# mit tests/test_core.py (gleicher Basename, kein __init__.py).
testpaths =
    tests
    playground/tests
    experiments/symmetry_lab/tests
# _archive: obsolete Tests (nicht lauffähig, nur Projektgedächtnis).
norecursedirs = _archive .git __pycache__ node_modules
